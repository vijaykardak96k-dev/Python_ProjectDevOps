# This file is intentionally not applied by: kubectl apply -f k8s/
# Create the real Secret from your own MongoDB URI instead:
#
# kubectl -n smart-farm create secret generic smart-farm-secrets \\
#   --from-literal=MONGO_URI='mongodb://USER:PASSWORD@HOST:27017/smartfarm?authSource=admin'
#
# Never commit real MongoDB credentials to Git.
apiVersion: v1
kind: Secret
metadata:
  name: smart-farm-secrets
  namespace: smart-farm
type: Opaque
stringData:
  MONGO_URI: "CHANGE_ME"
